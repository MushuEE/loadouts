function useParts(active) {
  // `active` is a Set of part ids that should light up gold.
  const on = (p) => active.has(p);
  const fill = (p) =>
    on(p)
      ? { fill: GOLD, stroke: '#fde68a', strokeWidth: 1.5, filter: 'url(#goldGlow)' }
      : { fill: '#232936', stroke: '#39414f', strokeWidth: 1.5 };
  const line = (p, width) =>
    on(p)
      ? { stroke: GOLD, strokeWidth: width, filter: 'url(#goldGlow)', fill: 'none', strokeLinecap: 'round' }
      : { stroke: '#39414f', strokeWidth: width, fill: 'none', strokeLinecap: 'round' };
  return { on, fill, line };
}

function SvgDefs() {
  return (
    <defs>
      <filter id="goldGlow" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="4.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <radialGradient id="floor" cx="50%" cy="50%">
        <stop offset="0%"   stopColor="#fbbf24" stopOpacity=".10" />
        <stop offset="100%" stopColor="#fbbf24" stopOpacity="0" />
      </radialGradient>
    </defs>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════════════ */

const effOz  = (it) => (it.user.overrideOz != null ? it.user.overrideOz : it.baseOz);
const toLbs  = (oz) => oz / 16;
const fmtLbs = (oz) => toLbs(oz).toFixed(2);
const fmtOz  = (oz) => `${oz.toFixed(1)}oz`;
const fmtUSD = (c)  => `$${(c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

/**
 * The canonical ordering for entries inside a slot.
 *
 * The last key is the item id, which is unique — that is what makes this a
 * TOTAL order. Because it is total, the sort's stability and the order rows
 * happened to arrive in are both irrelevant, which is the whole point: two
 * items sharing a tag must resolve to the same default position on every load,
 * on every backend, for every viewer.
 *
 * Do not remove the id comparison because it "never matters in practice". It
 * matters exactly when everything else ties, which is exactly when
 * nondeterminism would otherwise show up.
 */
function compareEntries(a, b) {
  if (a.worn !== b.worn) return a.worn ? -1 : 1;             // the active pick pins first
  if (a.position !== b.position) return a.position - b.position;
  const an = a.name.toLowerCase(), bn = b.name.toLowerCase();
  if (an !== bn) return an < bn ? -1 : 1;                    // predictable to a human
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;             // unique ⇒ total
}

/**
 * Tags union across the three layers, each attributed to the layer that first
 * introduced it. Union, not override: a community tagging something
 * `ul-approved` must never erase your own `cold-weather`.
 */
const TAG_LAYER_STYLE = {
  global:    { color: '#9d9d9d', borderColor: '#333b49', background: '#1b1f27' },
  community: { color: '#7cc0ff', borderColor: 'rgba(0,112,221,.45)', background: 'rgba(0,112,221,.10)' },
  user:      { color: '#fbbf24', borderColor: 'rgba(251,191,36,.40)', background: 'rgba(251,191,36,.08)' },
};

function mergedTags(item) {
  const seen = new Map();
  const add = (arr, layer) => (arr || []).forEach((t) => { if (!seen.has(t)) seen.set(t, layer); });
  add(item.global.tags, 'global');
  add(item.community.tags, 'community');
  add(item.user.tags, 'user');
  return Array.from(seen.entries())
    .map(([tag, layer]) => ({ tag, layer }))
    .sort((a, b) => (a.tag < b.tag ? -1 : a.tag > b.tag ? 1 : 0));
}

   ══════════════════════════════════════════════════════════════════════════ */

function Encumbrance({ w, tpl }) {
  const cap      = tpl.capacityLbs;
  // Each sport is judged on a different total: a hiker on what is on their back,
  // a cyclist on the entire rig. Reading the metric off the template keeps the
  // bike from vanishing out of its own weight limit.
  const gaugeOz  = tpl.gaugeMetric === 'total' ? w.skinOutOz : w.packOz;
  const buffOz   = tpl.buffMetric  === 'total' ? w.skinOutOz : w.baseOz;
  const pct      = Math.min(100, (toLbs(gaugeOz) / cap) * 100);
  const over     = toLbs(gaugeOz) > cap;
  const buffOn   = toLbs(buffOz) < tpl.buffThresholdLbs;
  const barColor = over ? '#ef4444' : pct > 85 ? '#f59e0b' : pct > 60 ? '#eab308' : '#22c55e';
  const headroom = cap - toLbs(gaugeOz);

  return (
    <Panel className="p-5">
      <SectionTitle right={<span className="font-mono text-[10px] text-dim">limit {cap.toFixed(1)} lb</span>}>
        Encumbrance Analytics
      </SectionTitle>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <StatBar label="Base Weight"  oz={w.baseOz}       total={w.skinOutOz} color="#22c55e" hint="Everything non-consumable you are responsible for carrying" />
        <StatBar label="Consumables"  oz={w.consumableOz} total={w.skinOutOz} color="#eab308" hint="Food, water, fuel — burns down as you move" />
        <StatBar label="Worn"         oz={w.wornOz}       total={w.skinOutOz} color="#0070dd" hint="On the body or on the bike, not in the bag" />
        <StatBar label="Total"        oz={w.skinOutOz}    total={w.skinOutOz} color="#e5e7eb" hint="Everything, all in" emphasis />
      </div>

      <div className="flex items-center justify-between mb-2">
        <span className="font-mono text-[10px] uppercase tracking-[.18em] text-dim">{tpl.capacityLabel}</span>
        <span className="font-mono text-[11px] tabular-nums" style={{ color: barColor }}>
          {fmtLbs(gaugeOz)} / {cap.toFixed(1)} lb · {pct.toFixed(0)}%
        </span>
      </div>

      <div className="h-3 rounded-full bg-inner border border-edge overflow-hidden relative">
        <div
          className="h-full rounded-full transition-all duration-500 ease-out relative overflow-hidden"
          style={{ width: `${Math.max(pct, 1.5)}%`, background: barColor, boxShadow: `0 0 14px ${barColor}66` }}
        >
          <div className="absolute inset-0 sheen" />
        </div>
        {[25, 50, 75].map((t) => (
          <div key={t} className="absolute top-0 bottom-0 w-px bg-void/70" style={{ left: `${t}%` }} />
        ))}
      </div>

      <div className="mt-4 flex flex-wrap items-center gap-3">
        <div
          className="flex items-center gap-2.5 px-3 py-2 rounded-lg border transition-colors duration-300"
          style={
            buffOn
              ? { borderColor: 'rgba(30,255,0,.35)', background: 'rgba(30,255,0,.07)', color: '#86efac' }
              : { borderColor: '#272d38', background: '#1b1f27', color: '#6b7484' }
          }
        >
          <span className={`text-sm ${buffOn ? 'tick' : ''}`}>{buffOn ? '✦' : '○'}</span>
          <span className="font-mono text-[11px] font-bold tracking-wide">
            {buffOn
              ? `${tpl.buffName} Active (${tpl.buffEffect})`
              : `${tpl.buffName} Inactive — ${tpl.buffMetricLabel} over ${tpl.buffThresholdLbs.toFixed(2)} lb`}
          </span>
        </div>

        <span className="font-mono text-[10px] text-dim">
          {over ? `⚠ ${Math.abs(headroom).toFixed(2)} lb over limit` : `${headroom.toFixed(2)} lb of headroom remaining`}
        </span>
      </div>
    </Panel>
  );
}

function StatBar({ label, oz, total, color, hint, emphasis }) {
  const pct = total > 0 ? (oz / total) * 100 : 0;

      <div className="h-1 rounded-full bg-void mt-2 overflow-hidden">
        <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, background: color }} />
      </div>
    </div>
  );
}

function PaperdollSlot({ slot, items, selectedId, onSelect }) {
  const anySelected = items.some((i) => i.id === selectedId);
  const filled = items.length > 0;
  // A multi-select slot takes its border from its most valuable occupant.
  const top = filled ? items.reduce((a, b) => (RARITY[b.rarity].rank > RARITY[a.rarity].rank ? b : a)) : null;
  const r = top ? RARITY[top.rarity] : null;

  return (
    <div
      id={`paperdoll-slot-${slot.id}`}
      className="relative rounded-lg border p-2.5 transition-all duration-200"
      style={{
        background: anySelected ? 'rgba(251,191,36,.09)' : '#1b1f27',
        borderColor: anySelected ? GOLD : r ? `${r.color}55` : '#272d38',
        boxShadow: anySelected ? '0 0 0 2px rgba(251,191,36,.30), 0 0 20px rgba(251,191,36,.22)' : r ? r.glow : 'none',
        opacity: filled ? 1 : .55,
      }}
    >
      {anySelected && (
        <span
          className="tick absolute -top-2 right-2 font-mono text-[8px] font-bold tracking-[.14em] px-1.5 py-0.5 rounded z-10"
          style={{ background: GOLD, color: '#0d0f12' }}
        >
          ACTIVE
        </span>
      )}

      <div className="flex items-center justify-between gap-2 mb-1.5">
        <span className="font-mono text-[8px] uppercase tracking-[.16em] text-dim">{slot.label}</span>
        {slot.multi && (
          <span
            className="font-mono text-[7px] uppercase tracking-[.14em] px-1 py-px rounded border shrink-0"
            style={{ color: '#86efac', borderColor: 'rgba(30,255,0,.3)' }}
            title="Multi-select: every item in this slot is carried, and every one counts"
          >
            ×{items.length || 0} multi
          </span>
        )}
      </div>

      {filled ? (
        <div className="space-y-0.5 -mx-1.5">
          {items.map((it) => (
            <SlotChip key={it.id} item={it} selected={it.id === selectedId} onSelect={onSelect} />
          ))}
        </div>
      ) : (
        <div className="flex items-center gap-2 text-dim px-1.5 py-1">
          <span className="text-lg leading-none opacity-30">◇</span>
          <span className="text-[11px] italic">{slot.hint}</span>
        </div>
      )}
    </div>
  );
}

function Paperdoll({ tpl, wornBySlot, selectedId, onSelect, wornOz, baseFromWornOz }) {
  const activeParts = useMemo(() => {
    const s = new Set();
    Object.entries(wornBySlot).forEach(([slotId, arr]) => {
      if (arr.some((i) => i.id === selectedId)) s.add(slotId);
    });
    return s;
  }, [wornBySlot, selectedId]);

  const Silhouette = tpl.Silhouette;
  const col = (side) => (
    <div className="flex flex-col gap-2.5">
      {tpl.slots.filter((s) => s.col === side).map((s) => (
        <PaperdollSlot key={s.id} slot={s} items={wornBySlot[s.id] || []} selectedId={selectedId} onSelect={onSelect} />
      ))}
    </div>
  );

  return (
    <Panel className="p-5">
      <SectionTitle
        right={
          <span className="font-mono text-[10px] text-dim tabular-nums">
            {fmtLbs(wornOz)} lb worn
            {baseFromWornOz > 0 && <span className="text-edge2"> · {fmtLbs(baseFromWornOz)} lb → base</span>}
          </span>
        }
      >
        Equipped · Paperdoll
      </SectionTitle>

      <div className="grid grid-cols-[1fr_auto_1fr] gap-3 items-center">
        {col('l')}
        <div className="w-[140px] sm:w-[190px] px-1">
          <Silhouette active={activeParts} />
        </div>
        {col('r')}
      </div>
    </Panel>
  );
}

function BagCell({ item, index, selected, onSelect }) {

    return (
      <div className="aspect-square rounded-lg border border-dashed border-edge/70 bg-inner/30 grid place-items-center">
        <span className="font-mono text-[9px] text-edge2 tabular-nums">{index + 1}</span>
      </div>
    );

  const r = RARITY[item.rarity];
  const overridden = item.user.overrideOz != null;

  return (
    <button
      id={`bag-cell-${item.id}`}
      onClick={() => onSelect(item.id)}
      aria-pressed={selected}
      title={`${item.name} — ${r.label}`}
      className="no-native-focus group relative aspect-square rounded-lg border transition-all duration-200 overflow-hidden
                 hover:-translate-y-0.5 active:scale-[.97] bg-inner"
      style={{
        borderColor: selected ? GOLD : r.color,
        boxShadow: selected ? '0 0 0 2px rgba(251,191,36,.32), 0 0 22px rgba(251,191,36,.24)' : r.glow,
      }}
    >
      <div
        className="absolute inset-0 opacity-[.11] group-hover:opacity-[.20] transition-opacity"
        style={{ background: `radial-gradient(circle at 50% 118%, ${r.color}, transparent 68%)` }}
      />
      <span className="absolute top-1 left-1.5 font-mono text-[9px] text-dim tabular-nums z-10">{index + 1}</span>

function BagGrid({ tpl, bag, filter, setFilter, selectedId, onSelect, onAutoSort, baseOz, consumableOz }) {
  const shown = filter === 'all' ? bag : bag.filter((i) => i.category === filter);
  const cells = Math.max(16, Math.ceil(shown.length / 4) * 4);
  const filters = [{ id: 'all', label: 'All' }].concat(tpl.categories);

  return (
    <Panel className="p-5">
      <SectionTitle right={<span className="font-mono text-[10px] text-dim tabular-nums">{shown.length} / {cells} slots</span>}>
        {tpl.bagLabel}
      </SectionTitle>

      <div className="flex flex-wrap items-center gap-2 mb-4">
        <div className="flex gap-1 bg-inner border border-edge rounded-lg p-1">
          {filters.map((f) => {
            const active = filter === f.id;
            const n = f.id === 'all' ? bag.length : bag.filter((i) => i.category === f.id).length;
            return (
              <button
                key={f.id}
                id={`filter-${f.id}`}
                onClick={() => setFilter(f.id)}
                className={`no-native-focus px-3 py-1.5 rounded-md text-[11px] font-semibold transition-all
                  ${active ? 'bg-gold/15 text-gold' : 'text-dim hover:text-ink hover:bg-white/5'}`}

          <span className="mr-1.5">⇅</span>Auto-Sort
        </Btn>
      </div>

      <div className="grid grid-cols-4 gap-2.5">
        {Array.from({ length: cells }, (_, i) => (
          <BagCell
            key={shown[i] ? shown[i].id : `ghost-${i}`}

function Inspector({ item, slot, onOverride, onResetOverride, onNote, onToggleEquip, blockedReason }) {
  const [layer, setLayer] = useState('global');
  const [draft, setDraft] = useState('');

  const itemId = item ? item.id : null;
  const itemOverride = item ? item.user.overrideOz : null;
  useEffect(() => { setDraft(itemOverride != null ? String(itemOverride) : ''); }, [itemId, itemOverride]);

  if (!item) {
    return (
      <Panel className="p-8 text-center">
        <div className="text-3xl mb-3 opacity-40">◇</div>
        <div className="text-sm text-dim">Select an item to inspect it.</div>
      </Panel>

  const r = RARITY[item.rarity];
  const overridden = item.user.overrideOz != null;
  const delta = overridden ? item.user.overrideOz - item.baseOz : 0;
  const multi = slot && slot.multi;
  const tags = mergedTags(item);

  function commitDraft(v) {
    setDraft(v);
    if (v.trim() === '') { onResetOverride(item.id); return; }
    const n = parseFloat(v);
    if (!isNaN(n) && n >= 0 && n < 1000) onOverride(item.id, Math.round(n * 10) / 10);
  }

  const equipVerb = item.worn

  return (

            className="w-14 h-14 rounded-lg grid place-items-center text-3xl shrink-0 border bg-void/55"
            style={{ borderColor: r.color, boxShadow: r.glow }}
          >
            {item.icon}
          </div>
          <div className="min-w-0 flex-1">
            <h3 className="text-base font-bold leading-tight" style={{ color: r.color, textShadow: `0 0 18px ${r.color}4d` }}>
              {item.name}
            </h3>
            <div className="flex flex-wrap items-center gap-x-2 gap-y-1 mt-1.5">
              <span className="font-mono text-[9px] font-bold uppercase tracking-[.16em]" style={{ color: r.color }}>{r.label}</span>

              <span className="font-mono text-[9px] uppercase tracking-[.14em] text-dim">{item.category}</span>
              {item.consumable && (
                <React.Fragment>

                </React.Fragment>

            </div>
            <div className="mt-2 flex flex-wrap gap-1.5">
              <span
                className="font-mono text-[9px] font-bold uppercase tracking-[.14em] px-2 py-0.5 rounded border"
                style={
                  item.worn
                    ? { color: GOLD, borderColor: 'rgba(251,191,36,.4)', background: 'rgba(251,191,36,.08)' }
                    : { color: '#6b7484', borderColor: '#272d38', background: '#1b1f27' }
                }
              >
                {item.worn ? '✦ Equipped' : 'Stowed'}
              </span>
              {item.countsAs === 'base' && (
                <span
                  className="font-mono text-[9px] font-bold uppercase tracking-[.14em] px-2 py-0.5 rounded border"
                  style={{ color: '#86efac', borderColor: 'rgba(30,255,0,.3)', background: 'rgba(30,255,0,.06)' }}
                  title="Counts toward base weight whether worn or stowed"
                >
                  → base weight

            </div>
          </div>
        </div>
      </div>

      <div className="p-5 border-b border-edge">
        <div className="space-y-1.5">
          {item.stats.map(([k, v]) => (
            <div key={k} className="flex items-baseline justify-between gap-4 text-[12px]">
              <span className="text-dim">{k}</span>
              <span className="font-mono text-ink tabular-nums text-right">{v}</span>
            </div>

        <div className="mt-4 pt-4 border-t border-edge space-y-1.5">

            <span className="font-mono text-gold tabular-nums">{fmtUSD(item.priceCents)}</span>
          </div>
          <div className="flex items-baseline justify-between gap-4 text-[12px]">

            <span className="font-mono tabular-nums font-bold" style={{ color: overridden ? GOLD : '#c9d1de' }}>

        {tags.length > 0 && (

              <div className="flex items-baseline justify-between mb-1">

                </span>

              <div className="h-1.5 rounded-full bg-void overflow-hidden border border-edge">

          <div className="rise space-y-3">
            <LayerNote>Your personal layer. Overrides everything above it, for your loadouts only.</LayerNote>

                  className="no-native-focus flex-1 min-w-0 bg-void border rounded-lg px-3 py-2 font-mono text-sm tabular-nums text-ink placeholder:text-edge2 transition-colors"
                  style={{ borderColor: overridden ? 'rgba(251,191,36,.5)' : '#272d38' }}

              <p className="text-[10px] text-dim mt-1.5 leading-relaxed">

            <div>
              <label htmlFor="public-note" className="font-mono text-[9px] uppercase tracking-[.16em] text-dim block mb-1.5">

              />

            <div>
              <label htmlFor="private-note" className="font-mono text-[9px] uppercase tracking-[.16em] text-dim block mb-1.5">

      <div className="p-5">

        </Btn>
        {blockedReason && <p className="text-[10px] text-dim mt-2 text-center leading-relaxed">{blockedReason}</p>}
        {multi && !blockedReason && (
          <p className="text-[10px] text-dim mt-2 text-center leading-relaxed">

          </p>
        )}
      </div>
    </Panel>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════════════════════════════════ */

const INITIAL_STATE = TEMPLATE_ORDER.reduce((acc, id) => {
  acc[id] = { items: TEMPLATES[id].items, selectedId: TEMPLATES[id].items[0].id, filter: 'all' };
  return acc;
}, {});

function App() {
  const [templateId, setTemplateId] = useState('backpacking');
  const [state, setState] = useState(INITIAL_STATE);
  const [forks, setForks] = useState(128);
  const [toast, setToast] = useState(null);

  const tpl = TEMPLATES[templateId];
  const { items, selectedId, filter } = state[templateId];

  const timer = useRef(null);
  const say = useCallback((msg) => {
    setToast(msg);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), 2600);
  }, []);
  useEffect(() => () => clearTimeout(timer.current), []);

  const setLocal = (patchObj) => setState((prev) => ({ ...prev, [templateId]: { ...prev[templateId], ...patchObj } }));
  const setItems = (fn) => setState((prev) => ({ ...prev, [templateId]: { ...prev[templateId], items: fn(prev[templateId].items) } }));

  const worn = useMemo(() => items.filter((i) => i.worn), [items]);
  const bag  = useMemo(() => items.filter((i) => !i.worn), [items]);

  const wornBySlot = useMemo(() => {
    const m = {};
    // Canonical order, not array order — see compareEntries. Two items sharing a
    // tag must always resolve the same way round.
    tpl.slots.forEach((s) => { m[s.id] = worn.filter((i) => i.wornSlot === s.id).sort(compareEntries); });
    return m;
  }, [worn, tpl]);

  const w = useMemo(() => {
    const sum = (arr) => arr.reduce((t, i) => t + effOz(i), 0);
    // `countsAs: 'base'` items count toward base weight even while equipped —
    // a beanie or head net lives in the pack as often as on your head.
    const baseFromWorn   = sum(worn.filter((i) => i.countsAs === 'base'));
    const trueWorn       = sum(worn.filter((i) => i.countsAs !== 'base'));
    const baseFromBag    = sum(bag.filter((i) => !i.consumable));
    const consumableOz   = sum(bag.filter((i) => i.consumable));
    const baseOz         = baseFromBag + baseFromWorn;
    return {
      baseOz, consumableOz, wornOz: trueWorn, baseFromWornOz: baseFromWorn,
      packOz: baseOz + consumableOz,
      skinOutOz: baseOz + consumableOz + trueWorn,
    };
  }, [bag, worn]);

  const totalValue = useMemo(() => items.reduce((t, i) => t + i.priceCents, 0), [items]);
  const selected   = useMemo(() => items.find((i) => i.id === selectedId) || null, [items, selectedId]);
  const selectedSlot = selected && selected.wornSlot ? tpl.slots.find((s) => s.id === selected.wornSlot) : null;

  /* ── mutations ── */

  const patch = (id, fn) => setItems((prev) => prev.map((i) => (i.id === id ? fn(i) : i)));
  const onOverride      = (id, oz)     => patch(id, (i) => ({ ...i, user: { ...i.user, overrideOz: oz } }));
  const onResetOverride = (id)         => patch(id, (i) => ({ ...i, user: { ...i.user, overrideOz: null } }));
  const onNote          = (id, k, val) => patch(id, (i) => ({ ...i, user: { ...i.user, [k]: val } }));

  function onToggleEquip(id) {
    setItems((prev) => {
      const target = prev.find((i) => i.id === id);
      if (!target || !target.wornSlot) return prev;
      const slot = tpl.slots.find((s) => s.id === target.wornSlot);

      if (target.worn) {
        say(`${target.short} removed from ${slot.label}.`);
        return prev.map((i) => (i.id === id ? { ...i, worn: false } : i));
      }

      // Multi-select slots accumulate; single slots displace their occupant.
      if (slot && slot.multi) {
        say(`${target.short} added to ${slot.label}.`);
        return prev.map((i) => (i.id === id ? { ...i, worn: true } : i));
      }

      const displaced = prev.find((i) => i.worn && i.wornSlot === target.wornSlot);
      say(displaced ? `${target.short} equipped — ${displaced.short} stowed.` : `${target.short} equipped.`);
      return prev.map((i) => {
        if (i.id === id) return { ...i, worn: true };
        if (displaced && i.id === displaced.id) return { ...i, worn: false };
        return i;
      });
    });
  }

  function onAutoSort() {
    setItems((prev) => {
      const wornPart = prev.filter((i) => i.worn);
      const bagPart = prev.filter((i) => !i.worn).sort((a, b) => {
        const d = RARITY[b.rarity].rank - RARITY[a.rarity].rank;
        return d !== 0 ? d : effOz(b) - effOz(a);
      });
      return wornPart.concat(bagPart);
    });
    say('Sorted by rarity, then weight.');
  }

  function onFork() { setForks((n) => n + 1); say('Forked into your account. It is yours to edit.'); }

  function onShare() {
    const url = `https://loadouts.app/l/gearhead/${templateId}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => say('Share link copied to your clipboard.'), () => say(url));
    } else { say(url); }
  }

  const blockedReason = selected && !selected.wornSlot
    ? 'This item has no paperdoll slot — it always stows in the bag.'
    : null;

  return (
    <React.Fragment>
      <Header templateId={templateId} onTemplate={setTemplateId} forks={forks} onFork={onFork} onShare={onShare} />

      <main className="max-w-[1600px] mx-auto px-4 sm:px-6 py-6 space-y-5">
        <ProfileBanner tpl={tpl} totalValue={totalValue} slotCount={items.length} wornCount={worn.length} />
        <Encumbrance w={w} tpl={tpl} />

        <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)_minmax(340px,.85fr)] gap-5 items-start">
          <Paperdoll
            tpl={tpl} wornBySlot={wornBySlot} selectedId={selectedId}
            onSelect={(id) => setLocal({ selectedId: id })}
            wornOz={w.wornOz} baseFromWornOz={w.baseFromWornOz}
          />

          <BagGrid
            tpl={tpl} bag={bag} filter={filter}
            setFilter={(f) => setLocal({ filter: f })}
            selectedId={selectedId}
            onSelect={(id) => setLocal({ selectedId: id })}
            onAutoSort={onAutoSort}
            baseOz={w.baseOz} consumableOz={w.consumableOz}
          />

          <div className="xl:sticky xl:top-[88px]">
            <Inspector
              item={selected} slot={selectedSlot}
              onOverride={onOverride} onResetOverride={onResetOverride} onNote={onNote}
              onToggleEquip={onToggleEquip} blockedReason={blockedReason}
            />
          </div>
        </div>

        <footer className="pt-2 pb-8 text-center">
          <p className="font-mono text-[10px] text-dim leading-relaxed">
            ╚oadouts prototype · three templates, one object model · every weight is live
          </p>
        </footer>
      </main>

      <Toast toast={toast} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
